<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C++ 命令窗口 · CppForge</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/terminal.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23131a28'/%3E%3Ctext x='50' y='66' font-size='44' font-family='monospace' font-weight='bold' text-anchor='middle' fill='%233ddc97'%3E%3E_%3C/text%3E%3C/svg%3E">
</head>
<body class="term-body">

    <div class="term-window">
        <!-- 标题栏 -->
        <div class="term-titlebar">
            <div class="traffic">
                <span class="dot dot-red"></span>
                <span class="dot dot-yellow"></span>
                <span class="dot dot-green"></span>
            </div>
            <div class="term-title">
                <i class="fas fa-terminal"></i>
                <span>C++ 命令执行窗口</span>
                <span class="term-file" id="term-file">main.cpp</span>
            </div>
            <div class="term-title-actions">
                <button class="tb-btn tb-back" id="btn-back" title="返回编辑器">
                    <i class="fas fa-arrow-left"></i><span>返回编辑器</span>
                </button>
            </div>
        </div>

        <!-- 工具条 -->
        <div class="term-toolbar">
            <button class="tb-btn primary" id="btn-rerun" title="重新编译并运行 (F5)">
                <i class="fas fa-play"></i><span>重新运行</span>
            </button>
            <button class="tb-btn" id="btn-stop" title="停止" disabled>
                <i class="fas fa-stop"></i><span>停止</span>
            </button>
            <button class="tb-btn" id="btn-clear" title="清空屏幕 (Ctrl+L)">
                <i class="fas fa-eraser"></i><span>清空</span>
            </button>
            <button class="tb-btn" id="btn-copy" title="复制全部输出">
                <i class="fas fa-copy"></i><span>复制</span>
            </button>
            <button class="tb-btn" id="btn-download" title="下载源代码">
                <i class="fas fa-download"></i><span>源码</span>
            </button>
            <div class="toolbar-spacer"></div>
            <div class="chips">
                <span class="chip" id="chip-compiler">GCC 13.2.0</span>
                <span class="chip" id="chip-std">C++17</span>
                <span class="chip chip-status" id="chip-status"><i class="fas fa-circle"></i> 准备中</span>
            </div>
        </div>

        <!-- 终端屏幕 -->
        <div class="term-screen" id="term-screen">
            <div class="term-lines" id="term-lines"></div>
        </div>

        <!-- 标准输入抽屉 -->
        <div class="stdin-drawer">
            <button class="stdin-toggle" id="btn-toggle-stdin">
                <i class="fas fa-chevron-up" id="stdin-chevron"></i>
                <span>标准输入 (stdin)</span>
                <span class="stdin-preview" id="stdin-preview"></span>
            </button>
            <div class="stdin-panel" id="stdin-panel">
                <textarea id="term-stdin" spellcheck="false" placeholder="程序的标准输入内容，例如：&#10;3 4"></textarea>
                <div class="stdin-actions">
                    <span class="stdin-tip">修改输入后，可用新输入重新运行程序</span>
                    <button class="tb-btn primary" id="btn-apply-stdin">
                        <i class="fas fa-rotate-right"></i><span>用此输入重新运行</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 底栏 -->
        <div class="term-footer">
            <span class="foot-item"><i class="fas fa-folder"></i> ~/project</span>
            <span class="foot-item" id="foot-exit">退出码 —</span>
            <span class="foot-spacer"></span>
            <span class="foot-item"><i class="fas fa-server"></i> Wandbox · Linux x86_64</span>
        </div>
    </div>

    <script src="js/compiler.js"></script>
    <script src="js/terminal.js"></script>
</body>
</html>
