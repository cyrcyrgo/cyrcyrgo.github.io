<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即时通讯系统</title>
  <style>
    /* ==================== CSS 自定义属性 ==================== */
    :root {
      --primary: #6c63ff;
      --primary-light: #8b83ff;
      --primary-dark: #5a52d5;
      --accent-green: #4ade80;
      --accent-red: #ff4444;
      --accent-orange: #ff6b6b;
      --bg-dark: #0f0c29;
      --bg-mid: #302b63;
      --bg-light: #24243e;
      --glass-bg: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.10);
      --glass-blur: 24px;
      --text-primary: #fff;
      --text-secondary: rgba(255, 255, 255, 0.6);
      --text-muted: rgba(255, 255, 255, 0.35);
      --text-dim: rgba(255, 255, 255, 0.2);
      --shadow-glow: 0 0 20px rgba(108, 99, 255, 0.3);
      --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ==================== 全局重置 ==================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-primary);
      overflow: hidden;
      position: relative;
      background: linear-gradient(135deg, var(--bg-dark), var(--bg-mid), var(--bg-light));
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      25% { background-position: 100% 0%; }
      50% { background-position: 100% 100%; }
      75% { background-position: 0% 100%; }
      100% { background-position: 0% 50%; }
    }

    /* ==================== 浮动粒子 ==================== */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      animation: floatParticle linear infinite;
    }
    .particle:nth-child(1) { left: 10%; width: 4px; height: 4px; animation-duration: 22s; animation-delay: 0s; }
    .particle:nth-child(2) { left: 20%; width: 8px; height: 8px; animation-duration: 28s; animation-delay: 2s; }
    .particle:nth-child(3) { left: 35%; width: 5px; height: 5px; animation-duration: 18s; animation-delay: 4s; }
    .particle:nth-child(4) { left: 50%; width: 3px; height: 3px; animation-duration: 25s; animation-delay: 1s; }
    .particle:nth-child(5) { left: 65%; width: 7px; height: 7px; animation-duration: 20s; animation-delay: 3s; }
    .particle:nth-child(6) { left: 75%; width: 4px; height: 4px; animation-duration: 30s; animation-delay: 5s; }
    .particle:nth-child(7) { left: 85%; width: 6px; height: 6px; animation-duration: 24s; animation-delay: 0.5s; }
    .particle:nth-child(8) { left: 45%; width: 9px; height: 9px; animation-duration: 26s; animation-delay: 3.5s; }
    .particle:nth-child(9) { left: 15%; width: 5px; height: 5px; animation-duration: 19s; animation-delay: 1.5s; }
    .particle:nth-child(10) { left: 90%; width: 3px; height: 3px; animation-duration: 27s; animation-delay: 2.5s; }
    .particle:nth-child(11) { left: 5%; width: 7px; height: 7px; animation-duration: 21s; animation-delay: 4.5s; }
    .particle:nth-child(12) { left: 55%; width: 4px; height: 4px; animation-duration: 23s; animation-delay: 0.8s; }

    @keyframes floatParticle {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
    }

    /* ==================== 扫描线纹理 ==================== */
    .scanline-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(255, 255, 255, 0.015) 2px,
        rgba(255, 255, 255, 0.015) 4px
      );
    }

    /* ==================== 动画关键帧 ==================== */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 8px rgba(108, 99, 255, 0.3); }
      50% { box-shadow: 0 0 20px rgba(108, 99, 255, 0.6); }
    }

    @keyframes typingDot {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes badgePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    @keyframes recordingPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ==================== 毛玻璃效果（增强） ==================== */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    /* ==================== 加载动画 ==================== */
    .loading-spinner {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-spinner.small {
      width: 18px;
      height: 18px;
      border-width: 2px;
    }
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      backdrop-filter: blur(4px);
    }

    /* ==================== 认证页面 ==================== */
    #authContainer {
      width: 400px;
      padding: 40px;
      animation: fadeInUp 0.6s ease-out;
      position: relative;
      z-index: 10;
    }

    #authContainer h1 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 28px;
      font-weight: 600;
      background: linear-gradient(135deg, var(--primary-light), var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #authContainer .subtitle {
      text-align: center;
      color: var(--text-secondary);
      margin-bottom: 30px;
      font-size: 14px;
    }

    .auth-input {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 16px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 15px;
      outline: none;
      transition: var(--transition-smooth);
    }

    .auth-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.15);
    }

    .auth-input::placeholder {
      color: var(--text-muted);
    }

    .auth-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: none;
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-smooth);
      position: relative;
      overflow: hidden;
    }

    .auth-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(108, 99, 255, 0.45);
    }

    .auth-btn:active {
      transform: translateY(0);
    }

    .auth-btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .auth-btn:hover::after {
      opacity: 1;
    }

    .auth-switch {
      text-align: center;
      margin-top: 20px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .auth-switch a {
      color: var(--primary);
      cursor: pointer;
      text-decoration: none;
      transition: color 0.2s;
    }

    .auth-switch a:hover {
      color: var(--primary-light);
      text-decoration: underline;
    }

    .auth-error {
      color: var(--accent-orange);
      font-size: 13px;
      text-align: center;
      margin-bottom: 12px;
      min-height: 20px;
    }

    /* ==================== 主界面 ==================== */
    #mainContainer {
      display: none;
      width: 900px;
      height: 600px;
      flex-direction: row;
      overflow: hidden;
      animation: fadeIn 0.5s ease-out;
      position: relative;
      z-index: 10;
    }

    /* 左侧联系人面板 */
    .sidebar {
      width: 280px;
      min-width: 280px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(255, 255, 255, 0.06);
    }

    .sidebar-header {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .sidebar-header h2 {
      font-size: 18px;
      font-weight: 600;
    }

    .sidebar-header .account-info {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .sidebar-header .logout-btn {
      float: right;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-primary);
      padding: 4px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: var(--transition-smooth);
    }

    .sidebar-header .logout-btn:hover {
      background: rgba(255, 107, 107, 0.25);
      border-color: var(--accent-orange);
      box-shadow: 0 0 12px rgba(255, 107, 107, 0.2);
    }

    /* ==================== 侧边栏标签 ==================== */
    .sidebar-tabs {
      display: flex;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .sidebar-tabs .tab {
      flex: 1;
      padding: 10px 4px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      cursor: pointer;
      transition: var(--transition-smooth);
      position: relative;
      border-bottom: 2px solid transparent;
    }
    .sidebar-tabs .tab:hover {
      color: var(--text-secondary);
    }
    .sidebar-tabs .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    .sidebar-tabs .tab .badge {
      display: inline-block;
      min-width: 16px;
      height: 16px;
      padding: 0 5px;
      background: var(--accent-red);
      color: #fff;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 700;
      line-height: 16px;
      margin-left: 4px;
      vertical-align: top;
      animation: badgePulse 2s ease-in-out infinite;
    }

    .contact-search {
      padding: 8px 12px;
    }

    .contact-search input {
      width: 100%;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
      transition: var(--transition-smooth);
    }

    .contact-search input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(108, 99, 255, 0.1);
    }

    .contact-search input::placeholder {
      color: rgba(255, 255, 255, 0.25);
    }

    .contact-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
    }

    .contact-list::-webkit-scrollbar {
      width: 4px;
    }

    .contact-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 2px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: var(--transition-smooth);
      margin-bottom: 2px;
      position: relative;
    }

    .contact-item:hover {
      background: rgba(255, 255, 255, 0.06);
      transform: scale(1.02);
    }

    .contact-item.active {
      background: rgba(108, 99, 255, 0.18);
      border: 1px solid rgba(108, 99, 255, 0.25);
      box-shadow: inset 0 0 20px rgba(108, 99, 255, 0.05);
    }

    .contact-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 600;
      margin-right: 12px;
      position: relative;
      flex-shrink: 0;
    }

    .online-dot {
      width: 10px;
      height: 10px;
      background: var(--accent-green);
      border-radius: 50%;
      border: 2px solid var(--bg-light);
      position: absolute;
      bottom: -2px;
      right: -2px;
    }

    .online-dot.away {
      background: #facc15;
    }
    .online-dot.busy {
      background: var(--accent-orange);
    }
    .online-dot.offline {
      background: rgba(255, 255, 255, 0.2);
    }

    .contact-info {
      flex: 1;
      min-width: 0;
    }

    .contact-name {
      font-size: 14px;
      font-weight: 500;
    }

    .contact-status {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* ==================== 未读消息徽章 ==================== */
    .unread-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      background: var(--accent-red);
      color: #fff;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: badgePulse 2s ease-in-out infinite;
      box-shadow: 0 0 8px rgba(255, 68, 68, 0.4);
    }

    .contact-item .unread-badge {
      position: absolute;
      top: 8px;
      right: 8px;
    }

    /* ==================== 好友/群聊页面 ==================== */
    #friendsView, #groupsView {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px;
      overflow-y: auto;
    }
    #friendsView::-webkit-scrollbar, #groupsView::-webkit-scrollbar {
      width: 4px;
    }
    #friendsView::-webkit-scrollbar-thumb, #groupsView::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 2px;
    }
    .friends-header, .groups-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .friends-header h3, .groups-header h3 {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
    }
    .add-friend-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: none;
      color: var(--text-primary);
      font-size: 18px;
      cursor: pointer;
      transition: var(--transition-smooth);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .add-friend-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 16px rgba(108, 99, 255, 0.4);
    }
    .friend-item, .group-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: var(--transition-smooth);
      margin-bottom: 2px;
    }
    .friend-item:hover, .group-item:hover {
      background: rgba(255, 255, 255, 0.06);
    }
    .friend-item.active, .group-item.active {
      background: rgba(108, 99, 255, 0.18);
      border: 1px solid rgba(108, 99, 255, 0.25);
    }
    .friend-requests-link {
      font-size: 12px;
      color: var(--primary);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: var(--transition-smooth);
    }
    .friend-requests-link:hover {
      background: rgba(108, 99, 255, 0.15);
    }
    .friend-requests-link .badge {
      display: inline-block;
      min-width: 16px;
      height: 16px;
      padding: 0 5px;
      background: var(--accent-red);
      color: #fff;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 700;
      line-height: 16px;
      margin-left: 4px;
      animation: badgePulse 2s ease-in-out infinite;
    }
    .group-member-count {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .create-group-btn {
      width: 100%;
      padding: 8px;
      background: rgba(108, 99, 255, 0.12);
      border: 1px dashed rgba(108, 99, 255, 0.3);
      border-radius: 8px;
      color: var(--primary);
      font-size: 13px;
      cursor: pointer;
      transition: var(--transition-smooth);
      margin-bottom: 8px;
    }
    .create-group-btn:hover {
      background: rgba(108, 99, 255, 0.2);
    }

    /* ==================== 弹窗 ==================== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.2s ease-out;
    }
    .modal-content {
      width: 400px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 30px;
      animation: fadeInUp 0.3s ease-out;
    }
    .modal-content h3 {
      font-size: 18px;
      margin-bottom: 20px;
      text-align: center;
    }
    .modal-content .modal-input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
      transition: var(--transition-smooth);
    }
    .modal-content .modal-input:focus {
      border-color: var(--primary);
    }
    .modal-content .modal-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: none;
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-smooth);
    }
    .modal-content .modal-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(108, 99, 255, 0.4);
    }
    .modal-content .modal-close {
      float: right;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-secondary);
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .modal-content .modal-close:hover {
      background: rgba(255, 107, 107, 0.2);
      color: var(--accent-orange);
    }
    .friend-request-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .friend-request-item .req-info {
      flex: 1;
    }
    .friend-request-item .req-name {
      font-size: 14px;
      font-weight: 500;
    }
    .friend-request-item .req-msg {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .friend-request-item .req-actions {
      display: flex;
      gap: 8px;
    }
    .friend-request-item .req-actions button {
      padding: 6px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: var(--transition-smooth);
    }
    .friend-request-item .req-accept {
      background: var(--accent-green);
      color: #000;
    }
    .friend-request-item .req-accept:hover {
      box-shadow: 0 0 12px rgba(74, 222, 128, 0.3);
    }
    .friend-request-item .req-reject {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-secondary);
    }
    .friend-request-item .req-reject:hover {
      background: rgba(255, 107, 107, 0.2);
      color: var(--accent-orange);
    }
    .friend-request-item .req-status {
      font-size: 12px;
      color: var(--text-muted);
    }
    .friend-request-item .req-status.accepted {
      color: var(--accent-green);
    }
    .friend-request-item .req-status.rejected {
      color: var(--accent-orange);
    }

    /* ==================== 右侧聊天面板 ==================== */
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header .chat-with {
      font-size: 16px;
      font-weight: 500;
    }

    .chat-header .chat-with span {
      color: var(--text-secondary);
    }

    .chat-header .chat-type-tag {
      font-size: 11px;
      color: var(--text-muted);
      margin-left: 8px;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.06);
    }

    .call-buttons {
      display: flex;
      gap: 8px;
    }

    .call-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition-smooth);
    }

    .call-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .call-btn.audio {
      background: rgba(74, 222, 128, 0.15);
      color: var(--accent-green);
      border: 1px solid rgba(74, 222, 128, 0.25);
    }
    .call-btn.audio:hover {
      box-shadow: 0 0 16px rgba(74, 222, 128, 0.2);
    }

    .call-btn.video {
      background: rgba(108, 99, 255, 0.15);
      color: var(--primary);
      border: 1px solid rgba(108, 99, 255, 0.25);
    }
    .call-btn.video:hover {
      box-shadow: 0 0 16px rgba(108, 99, 255, 0.2);
    }

    .call-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }

    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
    }

    .messages-area::-webkit-scrollbar {
      width: 4px;
    }

    .messages-area::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 2px;
    }

    .message {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.3s ease-out;
    }

    .message.self {
      align-items: flex-end;
    }

    .message.other {
      align-items: flex-start;
    }

    .message.system {
      align-items: center;
    }

    .message-bubble {
      max-width: 70%;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
      position: relative;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .message.self .message-bubble {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border-bottom-right-radius: 4px;
      border: 1px solid rgba(108, 99, 255, 0.3);
    }

    .message.other .message-bubble {
      background: rgba(255, 255, 255, 0.08);
      border-bottom-left-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .message.system .message-bubble {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 20px;
      max-width: 90%;
    }

    .message-time {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.25);
      margin-top: 4px;
      padding: 0 4px;
    }

    /* ==================== 加载更多 ==================== */
    .load-more {
      text-align: center;
      padding: 10px;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      transition: var(--transition-smooth);
    }
    .load-more:hover {
      color: var(--primary);
    }
    .load-more.loading {
      cursor: default;
      color: var(--text-muted);
    }

    /* ==================== 语音消息气泡 ==================== */
    .voice-message {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 160px;
    }
    .voice-play-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.12);
      color: var(--text-primary);
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-smooth);
      flex-shrink: 0;
    }
    .voice-play-btn:hover {
      background: var(--primary);
      transform: scale(1.1);
    }
    .voice-play-btn.playing {
      background: var(--primary);
      animation: glowPulse 1s ease-in-out infinite;
    }
    .voice-wave {
      flex: 1;
      height: 24px;
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .voice-wave-bar {
      flex: 1;
      height: 100%;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      transition: background 0.2s;
    }
    .voice-wave-bar.active {
      background: var(--primary);
    }
    .voice-duration {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      flex-shrink: 0;
      min-width: 30px;
      text-align: right;
    }

    /* ==================== 消息输入区 ==================== */
    .message-input-area {
      padding: 12px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .message-input-area input {
      flex: 1;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
      transition: var(--transition-smooth);
    }

    .message-input-area input::placeholder {
      color: rgba(255, 255, 255, 0.25);
    }

    .message-input-area input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(108, 99, 255, 0.1);
    }

    .mic-btn {
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 16px;
      transition: var(--transition-smooth);
      line-height: 1;
    }
    .mic-btn:hover {
      background: rgba(108, 99, 255, 0.15);
      border-color: var(--primary);
      color: var(--primary);
    }
    .mic-btn.recording {
      background: rgba(255, 68, 68, 0.2);
      border-color: var(--accent-red);
      color: var(--accent-red);
      animation: glowPulse 1s ease-in-out infinite;
    }

    .send-btn {
      padding: 12px 20px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: none;
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition-smooth);
      position: relative;
      overflow: hidden;
    }

    .send-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(108, 99, 255, 0.4);
    }

    .send-btn:active {
      transform: translateY(0);
    }

    .empty-chat {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 15px;
    }

    /* ==================== 录音指示器 ==================== */
    .recording-indicator {
      display: none;
      flex: 1;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      background: rgba(255, 68, 68, 0.06);
      border: 1px solid rgba(255, 68, 68, 0.15);
      border-radius: 10px;
    }
    .recording-indicator.active {
      display: flex;
    }
    .recording-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent-red);
      animation: recordingPulse 1s ease-in-out infinite;
      flex-shrink: 0;
    }
    .recording-timer {
      font-size: 14px;
      color: var(--accent-red);
      font-weight: 500;
      flex-shrink: 0;
    }
    .recording-label {
      font-size: 13px;
      color: var(--text-secondary);
      flex: 1;
    }
    .recording-cancel-btn {
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 12px;
      transition: var(--transition-smooth);
    }
    .recording-cancel-btn:hover {
      background: rgba(255, 68, 68, 0.2);
      border-color: var(--accent-red);
      color: var(--accent-red);
    }

    /* ==================== 输入提示动画 ==================== */
    .typing-indicator {
      display: none;
      padding: 4px 16px 8px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .typing-indicator.show {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .typing-dots {
      display: flex;
      gap: 3px;
      align-items: center;
    }
    .typing-dots span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--text-secondary);
      animation: typingDot 1.4s ease-in-out infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    /* ==================== 通话覆盖层 ==================== */
    #callOverlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 1000;
    }

    #callOverlay.active {
      display: flex;
      flex-direction: column;
    }

    /* 远程视频 - 大窗口 */
    #remoteVideo {
      flex: 1;
      width: 100%;
      object-fit: contain;
      background: #111;
    }

    /* 本地视频 - 画中画 */
    #localVideo {
      position: absolute;
      bottom: 100px;
      right: 20px;
      width: 200px;
      height: 150px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      background: #222;
    }

    /* 纯语音通话时的占位 */
    .audio-call-bg {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
    }

    .audio-call-bg .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: 600;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* 通话控制栏 */
    .call-controls {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .call-control-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-smooth);
    }

    .call-control-btn:hover {
      transform: scale(1.1);
    }

    .call-control-btn.mic {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
    }

    .call-control-btn.mic.muted {
      background: rgba(255, 107, 107, 0.25);
      color: var(--accent-orange);
    }

    .call-control-btn.camera {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
    }

    .call-control-btn.camera.off {
      background: rgba(255, 107, 107, 0.25);
      color: var(--accent-orange);
    }

    .call-control-btn.hangup {
      background: var(--accent-red);
      color: var(--text-primary);
      width: 64px;
      height: 64px;
      font-size: 26px;
    }

    .call-info {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 10;
    }

    .call-info .caller-name {
      font-size: 18px;
      font-weight: 600;
    }

    .call-info .call-status {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* ==================== 来电弹窗 ==================== */
    .incoming-call-toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 999;
      padding: 40px;
      text-align: center;
      min-width: 320px;
      animation: fadeInUp 0.4s ease-out;
    }

    .incoming-call-toast .caller-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 600;
      margin: 0 auto 16px;
    }

    .incoming-call-toast .caller-name {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .incoming-call-toast .call-type {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    .incoming-call-toast .action-btns {
      display: flex;
      gap: 24px;
      justify-content: center;
    }

    .incoming-call-toast .action-btns button {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 24px;
      transition: var(--transition-smooth);
    }

    .incoming-call-toast .action-btns button:hover {
      transform: scale(1.1);
    }

    .incoming-call-toast .btn-accept {
      background: var(--accent-green);
      color: var(--text-primary);
    }

    .incoming-call-toast .btn-reject {
      background: var(--accent-red);
      color: var(--text-primary);
    }

    /* ==================== 响应式 ==================== */
    @media (max-width: 920px) {
      #mainContainer {
        width: 100%;
        height: 100vh;
        border-radius: 0;
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        min-width: auto;
        height: 40%;
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
    }

    @media (max-width: 480px) {
      #authContainer {
        width: 90%;
        padding: 30px 20px;
      }
      #localVideo {
        width: 120px;
        height: 90px;
        bottom: 80px;
        right: 10px;
      }
      .call-control-btn {
        width: 48px;
        height: 48px;
        font-size: 18px;
      }
      .call-control-btn.hangup {
        width: 56px;
        height: 56px;
        font-size: 22px;
      }
      .incoming-call-toast {
        min-width: 260px;
        padding: 24px;
      }
    }
  </style>
</head>
<body>

  <!-- ==================== 浮动粒子 ==================== -->
  <div class="particles" aria-hidden="true">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <!-- ==================== 扫描线纹理 ==================== -->
  <div class="scanline-overlay" aria-hidden="true"></div>

  <!-- ==================== 认证页面 ==================== -->
  <div id="authContainer" class="glass">
    <h1>即时通讯</h1>
    <p class="subtitle">安全加密 · 实时通信</p>
    <div class="auth-error" id="authError"></div>
    <input type="text" class="auth-input" id="authAccount" placeholder="账号" autocomplete="username">
    <input type="password" class="auth-input" id="authPassword" placeholder="密码" autocomplete="current-password">
    <button class="auth-btn" id="authBtn">登录</button>
    <div class="auth-switch">
      <span id="authSwitchText">还没有账号？</span>
      <a id="authSwitchLink">注册</a>
    </div>
  </div>

  <!-- ==================== 主界面 ==================== -->
  <div id="mainContainer" class="glass">
    <!-- 左侧面板 -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button class="logout-btn" id="logoutBtn">退出登录</button>
        <h2>即时通讯</h2>
        <div class="account-info" id="accountInfo">已登录</div>
      </div>

      <!-- 侧边栏标签 -->
      <div class="sidebar-tabs" id="sidebarTabs">
        <button class="tab active" data-tab="contacts">联系人</button>
        <button class="tab" data-tab="friends">好友 <span class="badge" id="friendRequestBadge" style="display:none">0</span></button>
        <button class="tab" data-tab="groups">群聊</button>
      </div>

      <!-- 联系人视图 -->
      <div id="contactsView">
        <div class="contact-search">
          <input type="text" id="contactSearch" placeholder="搜索联系人...">
        </div>
        <div class="contact-list" id="contactList"></div>
      </div>

      <!-- 好友视图 -->
      <div id="friendsView" style="display:none">
        <div class="friends-header">
          <h3>我的好友</h3>
          <div>
            <span class="friend-requests-link" id="friendRequestsLink">请求 <span class="badge" id="friendReqBadge" style="display:none">0</span></span>
            <button class="add-friend-btn" id="addFriendBtn" title="添加好友">+</button>
          </div>
        </div>
        <div class="contact-list" id="friendsList"></div>
      </div>

      <!-- 群聊视图 -->
      <div id="groupsView" style="display:none">
        <div class="groups-header">
          <h3>我的群聊</h3>
        </div>
        <button class="create-group-btn" id="createGroupBtn">+ 创建群聊</button>
        <div class="contact-list" id="groupsList"></div>
      </div>
    </div>

    <!-- 右侧聊天面板 -->
    <div class="chat-panel">
      <div class="chat-header">
        <div class="chat-with">
          选择联系人开始聊天
          <span id="chatWithSub"></span>
          <span class="chat-type-tag" id="chatTypeTag" style="display:none"></span>
        </div>
        <div class="call-buttons" id="callButtons" style="display:none;">
          <button class="call-btn audio" id="audioCallBtn">🎤 语音</button>
          <button class="call-btn video" id="videoCallBtn">📹 视频</button>
        </div>
      </div>
      <div class="messages-area" id="messagesArea">
        <div class="empty-chat" id="emptyChat">选择一个联系人，开始聊天</div>
      </div>
      <!-- 输入提示 -->
      <div class="typing-indicator" id="typingIndicator">
        <span>对方正在输入</span>
        <div class="typing-dots">
          <span></span><span></span><span></span>
        </div>
      </div>
      <div class="message-input-area" id="messageInputArea" style="display:none;">
        <!-- 录音指示器 -->
        <div class="recording-indicator" id="recordingIndicator">
          <div class="recording-dot"></div>
          <span class="recording-timer" id="recordingTimer">00:00</span>
          <span class="recording-label">录音中...</span>
          <button class="recording-cancel-btn" id="recordingCancelBtn">取消</button>
        </div>
        <input type="text" id="messageInput" placeholder="输入消息，按 Enter 发送" maxlength="2000">
        <button class="mic-btn" id="micBtn" title="语音消息">🎤</button>
        <button class="send-btn" id="sendBtn">发送</button>
      </div>
    </div>
  </div>

  <!-- ==================== 来电弹窗 ==================== -->
  <div class="glass incoming-call-toast" id="incomingCallToast" style="display:none;">
    <div class="caller-avatar" id="incomingAvatar">?</div>
    <div class="caller-name" id="incomingCallerName">未知用户</div>
    <div class="call-type" id="incomingCallType">视频通话邀请</div>
    <div class="action-btns">
      <button class="btn-accept" id="acceptCallBtn">📞</button>
      <button class="btn-reject" id="rejectCallBtn">✕</button>
    </div>
  </div>

  <!-- ==================== 通话覆盖层 ==================== -->
  <div id="callOverlay">
    <div class="call-info">
      <div class="caller-name" id="callPeerName">用户</div>
      <div class="call-status" id="callStatus">通话中...</div>
    </div>
    <!-- 远程视频（大窗口） -->
    <video id="remoteVideo" autoplay playsinline></video>
    <!-- 本地视频（画中画） -->
    <video id="localVideo" autoplay playsinline muted></video>
    <!-- 通话控制栏 -->
    <div class="call-controls">
      <button class="call-control-btn mic" id="micToggleBtn" title="麦克风">🎤</button>
      <button class="call-control-btn camera" id="cameraToggleBtn" title="摄像头">📷</button>
      <button class="call-control-btn hangup" id="hangupBtn" title="挂断">📞</button>
    </div>
  </div>

  <!-- ==================== 添加好友弹窗 ==================== -->
  <div id="addFriendModal" style="display:none;">
    <div class="modal-overlay">
      <div class="modal-content glass">
        <button class="modal-close" id="addFriendModalClose">✕</button>
        <h3>添加好友</h3>
        <input type="text" class="modal-input" id="addFriendAccount" placeholder="对方账号">
        <input type="text" class="modal-input" id="addFriendMessage" placeholder="添加好友消息（选填）">
        <button class="modal-btn" id="addFriendSubmit">发送好友请求</button>
      </div>
    </div>
  </div>

  <!-- ==================== 好友请求列表弹窗 ==================== -->
  <div id="friendRequestsModal" style="display:none;">
    <div class="modal-overlay">
      <div class="modal-content glass">
        <button class="modal-close" id="friendRequestsModalClose">✕</button>
        <h3>好友请求</h3>
        <div id="friendRequestsList"></div>
        <div id="sentFriendRequestsList" style="margin-top:16px;">
          <h4 style="font-size:14px;color:var(--text-muted);margin-bottom:8px;">已发送的请求</h4>
          <div id="sentRequestsList"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== 创建群聊弹窗 ==================== -->
  <div id="createGroupModal" style="display:none;">
    <div class="modal-overlay">
      <div class="modal-content glass">
        <button class="modal-close" id="createGroupModalClose">✕</button>

    // ================================================================
    //  音效管理器 (Web Audio API)
    // ================================================================
    const SoundManager = {
      audioCtx: null,
      _ringtoneInterval: null,

      init() {
        try {
          this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {
          console.warn('[SoundManager] Web Audio API 不可用', e);
        }
      },

      ensureCtx() {
        if (!this.audioCtx) this.init();
        if (this.audioCtx && this.audioCtx.state === 'suspended') {
          this.audioCtx.resume();
        }
      },

      // 发送消息提示音 - 短促清脆的"叮"
      playSend() {
        this.ensureCtx();
        if (!this.audioCtx) return;
        this._playTone(800, 0.1, 'sine', 0.3);
      },

      // 收到消息提示音 - 柔和的"叮咚"双音
      playReceive() {
        this.ensureCtx();
        if (!this.audioCtx) return;
        this._playTone(1047, 0.15, 'sine', 0.25);
        setTimeout(() => {
          this._playTone(1319, 0.15, 'sine', 0.25);
        }, 160);
      },

      // 来电铃声 - 循环的"叮~叮~"节奏
      playRingtone() {
        this.ensureCtx();
        if (!this.audioCtx) return;
        this.stopRingtone();
        const playBeep = () => {
          if (!this.audioCtx) return;
          this._playTone(440, 0.5, 'sawtooth', 0.2);
        };
        playBeep();
        this._ringtoneInterval = setInterval(playBeep, 800);
      },

      stopRingtone() {
        if (this._ringtoneInterval) {
          clearInterval(this._ringtoneInterval);
          this._ringtoneInterval = null;
        }
      },

      // 辅助方法：播放单音
      _playTone(freq, duration, type, volume) {
        if (!this.audioCtx) return;
        try {
          const osc = this.audioCtx.createOscillator();
          const gain = this.audioCtx.createGain();
          osc.type = type || 'sine';
          osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime);
          gain.gain.setValueAtTime(volume || 0.3, this.audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.audioCtx.destination);
          osc.start();
          osc.stop(this.audioCtx.currentTime + duration);
        } catch (e) {
          // 静默忽略音频错误
        }
      }
    };

    // ================================================================
    //  语音录制器
    // ================================================================
    const VoiceRecorder = {
      mediaRecorder: null,
      audioChunks: [],
      isRecording: false,
      startTime: null,
      timerInterval: null,

      async start() {
        if (this.isRecording) return;
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          this.audioChunks = [];
          this.mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });

          this.mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) {
              this.audioChunks.push(e.data);
            }
          };

          this.mediaRecorder.onstop = () => {
            // 停止所有轨道
            stream.getTracks().forEach(t => t.stop());
            // 如果有关闭的 chunks，处理
            if (this.audioChunks.length > 0 && !this._cancelled) {
              this._encodeAndSend();
            }
            this.audioChunks = [];
            this.isRecording = false;
          };

          this.mediaRecorder.start(100);
          this.isRecording = true;
          this._cancelled = false;
          this.startTime = Date.now();

          // 启动计时器
          const timerEl = document.getElementById('recordingTimer');
          this.timerInterval = setInterval(() => {
            if (!this.startTime) return;
            const elapsed = Math.floor((Date.now() - this.startTime) / 1000);
            const min = String(Math.floor(elapsed / 60)).padStart(2, '0');
            const sec = String(elapsed % 60).padStart(2, '0');
            timerEl.textContent = min + ':' + sec;
          }, 200);

          return true;
        } catch (err) {
          console.warn('[VoiceRecorder] 启动录音失败:', err.message);
          alert('无法访问麦克风，请检查权限设置');
          return false;
        }
      },

      stop() {
        if (!this.isRecording || !this.mediaRecorder) return;
        this._cancelled = false;
        try {
          this.mediaRecorder.stop();
        } catch (e) {
          // 忽略
        }
        this.isRecording = false;
        this._stopTimer();
      },

      cancel() {
        if (!this.isRecording || !this.mediaRecorder) return;
        this._cancelled = true;
        try {
          this.mediaRecorder.stop();
        } catch (e) {
          // 忽略
        }
        this.isRecording = false;
        this.audioChunks = [];
        this._stopTimer();
      },

      _stopTimer() {
        if (this.timerInterval) {
          clearInterval(this.timerInterval);
          this.timerInterval = null;
        }
      },

      _encodeAndSend() {
        const blob = new Blob(this.audioChunks, { type: 'audio/webm;codecs=opus' });
        const reader = new FileReader();
        reader.onloadend = () => {
          const base64 = reader.result.split(',')[1];
          if (base64 && STATE.selectedContact) {
            sendWSMessage({
              type: 'voice-chat',
              to: STATE.selectedContact,
              toType: STATE.selectedContactType,
              audioData: base64,
              duration: Math.floor((Date.now() - this.startTime) / 1000)
            });
            // 播放发送音效
            SoundManager.playSend();
          }
        };
        reader.readAsDataURL(blob);
      }
    };

    // ================================================================
    //  工具函数
    // ================================================================
    function formatTime(ts) {
      const d = new Date(ts);
      return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
    }

    function formatDateTime(ts) {
      const d = new Date(ts);
      const month = (d.getMonth() + 1).toString().padStart(2, '0');
      const day = d.getDate().toString().padStart(2, '0');
      const hours = d.getHours().toString().padStart(2, '0');
      const mins = d.getMinutes().toString().padStart(2, '0');
      return month + '-' + day + ' ' + hours + ':' + mins;
    }

    function addLog(msg) {

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatDuration(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return m + ':' + String(s).padStart(2, '0');
    }

    function formatCallDuration(seconds) {
      if (seconds < 60) return seconds + '秒';
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return m + '分' + s + '秒';
    }

    // ================================================================
    //  HTTP API 调用
    // ================================================================
    async function apiFetch(endpoint, options = {}) {
      const url = 'https://' + SERVER_HOST + endpoint;
      const headers = {
        'Content-Type': 'application/json',
        ...(options.headers || {})
      };
      if (STATE.token) {
        headers['Authorization'] = 'Bearer ' + STATE.token;
      }
      const res = await fetch(url, {
        ...options,
        headers,
        credentials: 'include'
      });
      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.message || 'API 请求失败');
      }
      return data;
    }

    // ================================================================
    let isLoginMode = true;

    authSwitchLink.addEventListener('click', () => {
      isLoginMode = !isLoginMode;
      authBtn.textContent = isLoginMode ? '登录' : '注册';
      authSwitchText.textContent = isLoginMode ? '还没有账号？' : '已有账号？';
      authSwitchLink.textContent = isLoginMode ? '注册' : '登录';
      authError.textContent = '';
    });

    authBtn.addEventListener('click', handleAuth);
    authAccount.addEventListener('keydown', (e) => { if (e.key === 'Enter') authPassword.focus(); });
    authPassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleAuth(); });

    async function handleAuth() {
      const accountId = authAccount.value.trim();
      const password = authPassword.value.trim();
      if (!accountId || !password) {
        authError.textContent = '请填写账号和密码';
        return;
      }
      authError.textContent = '';
      authBtn.disabled = true;
      authBtn.textContent = '处理中...';

      try {
        const endpoint = isLoginMode ? '/api/login' : '/api/register';
        const res = await fetch('https://' + SERVER_HOST + endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ accountId, password }),
          credentials: 'include'
        });
        const data = await res.json();
        if (data.success) {
          STATE.token = data.token;
          STATE.accountId = data.accountId;
          localStorage.setItem('token', data.token);
          localStorage.setItem('accountId', data.accountId);
          // 存储 cookie
          document.cookie = 'token=' + data.token + '; path=/; max-age=86400';
          document.cookie = 'accountId=' + data.accountId + '; path=/; max-age=86400';
          showMain();
          connectWebSocket();
          loadFriends();
          loadGroups();
          loadFriendRequests();
        } else {
          authError.textContent = data.message;
        }
      } catch (err) {
        authError.textContent = '网络错误，请检查服务器是否运行';
        addLog('认证错误: ' + err.message);
      }

      authBtn.disabled = false;
      authBtn.textContent = isLoginMode ? '登录' : '注册';
    }

    logoutBtn.addEventListener('click', () => {
      disconnectWebSocket();
      STATE.token = '';
      STATE.accountId = '';
      localStorage.removeItem('token');
      localStorage.removeItem('accountId');
      // 清除 cookie
      document.cookie = 'token=; path=/; max-age=0';
      document.cookie = 'accountId=; path=/; max-age=0';
      showAuth();
    });

    function showAuth() {
      authContainer.style.display = 'block';
      mainContainer.style.display = 'none';

    function showMain() {

    // 检查是否已有登录状态 - 同时检查 cookie
    async function checkAuthOnLoad() {
      if (STATE.token && STATE.accountId) {
        // 尝试验证 token

          await apiFetch('/api/auth/check');
          showMain();
          connectWebSocket();
          loadFriends();
          loadGroups();
          loadFriendRequests();
        } catch (e) {
          // token 无效，尝试刷新
          addLog('Token 验证失败，需要重新登录');
          STATE.token = '';
          STATE.accountId = '';
          localStorage.removeItem('token');
          localStorage.removeItem('accountId');
        }
      }
    }

    checkAuthOnLoad();

    // ================================================================
    //  WebSocket 模块
    // ================================================================
    function connectWebSocket() {
      if (STATE.ws) {
        try { STATE.ws.close(); } catch {}
      }

      const wsUrl = 'wss://' + SERVER_HOST + '/?token=' + STATE.token + '&accountId=' + STATE.accountId;
      addLog('正在连接WebSocket: ' + SERVER_HOST);

      STATE.ws = new WebSocket(wsUrl);

      STATE.ws.onopen = () => {
        addLog('WebSocket已连接');
        STATE.reconnectAttempt = 0;
        // 初始化音效管理器
        SoundManager.init();
      };

      STATE.ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          handleWSMessage(msg);
        } catch (err) {
          addLog('消息解析失败: ' + err.message);
        }
      };

      STATE.ws.onclose = () => {
        addLog('WebSocket已断开');
        if (STATE.inCall) {
          hangupCall();
        }
        scheduleReconnect();
      };

      STATE.ws.onerror = () => {
        addLog('WebSocket错误');
      };
    }

    function disconnectWebSocket() {
      STATE.reconnectAttempt = Infinity; // 阻止重连
      if (STATE.ws) {
        try { STATE.ws.close(); } catch {}
        STATE.ws = null;
      }
    }

    function scheduleReconnect() {
      if (STATE.reconnectAttempt >= Infinity) return;
      STATE.reconnectAttempt++;
      const delay = Math.min(1000 * Math.pow(2, STATE.reconnectAttempt - 1), STATE.maxReconnectDelay);
      addLog('将在 ' + Math.round(delay/1000) + ' 秒后重连...');
      setTimeout(() => {
        if (STATE.token && STATE.accountId) {
          connectWebSocket();
        }
      }, delay);
    }

    function sendWSMessage(data) {
      if (STATE.ws && STATE.ws.readyState === WebSocket.OPEN) {
        STATE.ws.send(JSON.stringify(data));
        return true;
      }
      return false;
    }

    // ================================================================
    //  WebSocket 消息处理
    // ================================================================
    function handleWSMessage(msg) {
      switch (msg.type) {
        case 'welcome':
          addLog('欢迎: ' + msg.accountId);
          break;

        case 'online-users':
          STATE.onlineUsers = msg.users || [];
          renderContactList();
          break;

        case 'chat':
          // 收到消息
          if (STATE.selectedContact === msg.from && STATE.selectedContactType === 'user') {
            appendMessage(msg.from, msg.content, false, msg.timestamp);
            SoundManager.playReceive();
          } else {
            STATE.unreadCounts[msg.from] = (STATE.unreadCounts[msg.from] || 0) + 1;
            renderContactList();
            SoundManager.playReceive();
          }
          break;

        case 'chat-ack':
          // 消息发送回执
          if (STATE.selectedContact === msg.to) {
            appendMessage(msg.to, msg.content, true, msg.timestamp, msg.delivered);
          }
          break;

        case 'voice-chat':
          // 收到语音消息
          if (STATE.selectedContact === msg.from && STATE.selectedContactType === 'user') {
            appendVoiceMessage(msg.from, msg.audioData, msg.duration, false, msg.timestamp);
            SoundManager.playReceive();
          } else {
            STATE.unreadCounts[msg.from] = (STATE.unreadCounts[msg.from] || 0) + 1;
            renderContactList();
            SoundManager.playReceive();
          }
          break;

        case 'call-offer':
          // 收到通话邀请
          STATE.pendingOffer = msg;
          showIncomingCall(msg.from, msg.callType);
          SoundManager.playRingtone();
          break;

        case 'call-answer':
          // 对方接受了通话
          SoundManager.stopRingtone();
          clearCallTimeout();
          if (STATE.pc && STATE.isCaller) {
            handleRemoteAnswer(msg.sdp);
          }
          break;

        case 'ice-candidate':
          // 收到ICE候选
          if (STATE.pc && msg.candidate) {
            STATE.pc.addIceCandidate(new RTCIceCandidate(msg.candidate)).catch(e => {
              addLog('添加ICE候选失败: ' + e.message);
            });
          }
          break;

        case 'call-end':
          // 对方挂断
          SoundManager.stopRingtone();
          clearCallTimeout();
          addLog('对方挂断了通话');
          if (STATE.inCall) {
            hangupCall();
          }
          incomingCallToast.style.display = 'none';
          break;

        case 'call-timeout':
          // 对方未响应
          SoundManager.stopRingtone();
          clearCallTimeout();
          addLog('对方未响应');
          if (STATE.inCall) {
            hangupCall();
          }
          incomingCallToast.style.display = 'none';
          break;

        case 'friend-request':
          // 收到好友请求
          STATE.friendRequestCount = (STATE.friendRequestCount || 0) + 1;
          updateFriendRequestBadge();
          if (msg.from) {
            addLog('收到来自 ' + msg.from + ' 的好友请求');
          }
          break;

        case 'friend-request-accepted':
          // 好友请求被接受
          addLog(msg.from + ' 接受了你的好友请求');
          loadFriends();
          break;

        case 'friend-request-rejected':
          // 好友请求被拒绝
          addLog(msg.from + ' 拒绝了你的好友请求');
          loadFriendRequests();
          break;

        case 'friend-removed':
          addLog(msg.from + ' 已将你从好友列表中移除');
          loadFriends();
          break;

        case 'group-created':
          addLog('群聊 ' + msg.groupName + ' 创建成功');
          loadGroups();
          break;

        case 'group-message':
          if (STATE.selectedContact === msg.groupId && STATE.selectedContactType === 'group') {
            appendMessage(msg.from, msg.content, false, msg.timestamp, false, true);
          } else {
            STATE.unreadCounts[msg.groupId] = (STATE.unreadCounts[msg.groupId] || 0) + 1;
            renderContactList();
          }
          break;

        case 'group-updated':
          loadGroups();
          if (STATE.selectedContact === msg.groupId) {
            loadGroupMembers(msg.groupId);
          }
          break;

        case 'group-voice-call-start':
          // 群语音通话开始
          addLog('群语音通话已开始');
          break;

        case 'group-voice-call-end':
          addLog('群语音通话已结束');
          break;

        case 'error':
          addLog('服务器错误: ' + msg.message);
          break;
      }
    }

    // ================================================================
    //  侧边栏标签切换
    // ================================================================
    sidebarTabs.addEventListener('click', (e) => {
      const tab = e.target.closest('.tab');
      if (!tab) return;

    // ================================================================
    //  联系人列表
    // ================================================================
    function renderContactList() {
      const searchTerm = contactSearch.value.trim().toLowerCase();
      let users = STATE.onlineUsers.filter(u => u !== STATE.accountId);

      if (searchTerm) {
        users = users.filter(u => u.toLowerCase().includes(searchTerm));
      }

      if (users.length === 0) {
        contactList.innerHTML = `
          <div style="text-align:center;padding:30px;color:var(--text-dim);font-size:13px;">
            ${searchTerm ? '无匹配联系人' : '暂无在线用户'}
          </div>
        `;
        return;
      }

      // 对用户列表排序：有未读消息的排前面
      const sortedUsers = [...users].sort((a, b) => {
        const unreadA = STATE.unreadCounts[a] || 0;
        const unreadB = STATE.unreadCounts[b] || 0;
        if (unreadB !== unreadA) return unreadB - unreadA;
        return a.localeCompare(b);
      });

      contactList.innerHTML = sortedUsers.map(u => {
        const isActive = STATE.selectedContact === u && STATE.selectedContactType === 'user';
        const avatarChar = getAvatarChar(u);
        const unreadCount = STATE.unreadCounts[u] || 0;

    // ================================================================
    //  消息历史
    // ================================================================
    async function loadMessageHistory(targetId, type) {
      if (STATE.messageLoading) return;
      STATE.messageLoading = true;

      try {
        const endpoint = type === 'group' ? '/api/messages/group/' + targetId : '/api/messages/' + targetId;
        const page = STATE.messagePage;
        const data = await apiFetch(endpoint + '?page=' + page + '&limit=20');

        if (data.messages && data.messages.length > 0) {
          STATE.hasMoreMessages = data.messages.length >= 20;

          // 移除加载更多指示器
          const loadMoreEl = document.querySelector('.load-more');
          if (loadMoreEl) loadMoreEl.remove();

          // 渲染消息
          data.messages.reverse().forEach(msg => {
            if (msg.type === 'call-record') {
              appendCallRecord(msg, msg.isSelf);
            } else if (msg.type === 'voice') {
              appendVoiceMessage(msg.from, msg.audioData, msg.duration, msg.isSelf, msg.timestamp, type === 'group');
            } else {
              appendMessage(msg.from, msg.content, msg.isSelf, msg.timestamp, msg.delivered, type === 'group');
            }
          });

          // 如果还有更多消息，添加加载更多按钮
          if (STATE.hasMoreMessages) {
            const loadMoreDiv = document.createElement('div');
            loadMoreDiv.className = 'load-more';
            loadMoreDiv.textContent = '加载更多...';
            loadMoreDiv.addEventListener('click', () => {
              STATE.messagePage++;
              loadMessageHistory(targetId, type);
            });
            messagesArea.insertBefore(loadMoreDiv, messagesArea.firstChild);
          }

          STATE.messagePage++;
        } else {
          STATE.hasMoreMessages = false;
        }
      } catch (err) {
        addLog('加载消息历史失败: ' + err.message);
      }

      STATE.messageLoading = false;
    }

    // ================================================================
    //  语音消息
    // ================================================================
    function appendVoiceMessage(accountId, audioData, duration, isSelf, timestamp, isGroup) {
      emptyChat.style.display = 'none';

      const div = document.createElement('div');
      div.className = 'message ' + (isSelf ? 'self' : 'other');

      const timeStr = formatTime(timestamp || Date.now());
      const durationStr = duration ? formatDuration(duration) : '--';
      const senderLabel = isGroup && !isSelf ? '<div style="font-size:11px;color:var(--text-muted);margin-bottom:2px;">' + escapeHtml(accountId) + '</div>' : '';

      // 构建语音消息气泡
      div.innerHTML = `
        <div class="message-bubble">
          ${senderLabel}
          <div class="voice-message">
            <button class="voice-play-btn" data-audio="${escapeHtml(audioData)}">▶</button>
            <div class="voice-wave">
              ${Array.from({length: 20}, (_, i) => '<div class="voice-wave-bar" data-index="' + i + '"></div>').join('')}
            </div>
            <span class="voice-duration">${durationStr}</span>
          </div>
        </div>
        <div class="message-time">${timeStr}</div>
      `;

      messagesArea.appendChild(div);
      messagesArea.scrollTop = messagesArea.scrollHeight;

      // 绑定播放事件
      const playBtn = div.querySelector('.voice-play-btn');
      if (playBtn) {
        playBtn.addEventListener('click', function() {
          const audioBase64 = this.getAttribute('data-audio');
          if (this.classList.contains('playing')) {
            // 停止播放
            if (window._voiceAudio) {
              window._voiceAudio.pause();
              window._voiceAudio = null;
            }
            this.classList.remove('playing');
            this.textContent = '▶';
            // 重置波形
            div.querySelectorAll('.voice-wave-bar').forEach(b => b.classList.remove('active'));
            return;
          }

          // 停止之前的播放
          if (window._voiceAudio) {
            window._voiceAudio.pause();
            window._voiceAudio = null;
          }
          document.querySelectorAll('.voice-play-btn.playing').forEach(b => {
            b.classList.remove('playing');
            b.textContent = '▶';
          });
          document.querySelectorAll('.voice-wave-bar.active').forEach(b => b.classList.remove('active'));

          try {
            const audio = new Audio('data:audio/webm;codecs=opus;base64,' + audioBase64);
            window._voiceAudio = audio;
            this.classList.add('playing');
            this.textContent = '⏹';

            const bars = div.querySelectorAll('.voice-wave-bar');
            let animFrame = null;

            function animateWave() {
              if (!audio.paused && !audio.ended) {
                bars.forEach((bar, i) => {
                  const val = Math.sin(Date.now() / 200 + i * 0.5) * 0.5 + 0.5;
                  const height = 4 + val * 20;
                  bar.style.height = height + 'px';
                  bar.classList.toggle('active', val > 0.6);
                });
                animFrame = requestAnimationFrame(animateWave);
              }
            }
            animateWave();

            audio.onended = () => {
              this.classList.remove('playing');
              this.textContent = '▶';
              bars.forEach(b => {
                b.classList.remove('active');
                b.style.height = '';
              });
              if (animFrame) cancelAnimationFrame(animFrame);
              window._voiceAudio = null;
            };

            audio.play().catch(() => {
              this.classList.remove('playing');
              this.textContent = '▶';
            });
          } catch (e) {
            this.classList.remove('playing');
            this.textContent = '▶';
          }
        });
      }
    }

    async function startCall(callType) {
      if (!STATE.selectedContact) return;
      if (STATE.inCall) return;

      STATE.isCaller = true;
      STATE.callType = callType;
      STATE.callPeer = STATE.selectedContact;

      try {
        // 获取本地媒体流
        const constraints = {
          audio: true,
          video: callType === 'video'
        };
        STATE.localStream = await navigator.mediaDevices.getUserMedia(constraints);

        // 创建PeerConnection
        createPeerConnection();

        // 添加本地流
        STATE.localStream.getTracks().forEach(track => {
          STATE.pc.addTrack(track, STATE.localStream);
        });

        // 创建Offer
        const offer = await STATE.pc.createOffer();
        await STATE.pc.setLocalDescription(offer);

        // 发送Offer
        const msgType = STATE.selectedContactType === 'group' ? 'group-call-offer' : 'call-offer';
        sendWSMessage({
          type: msgType,
          to: STATE.selectedContact,
          sdp: STATE.pc.localDescription,
          callType: callType
        });

        // 显示通话界面
        showCallUI(callType);
        addLog('已发起' + (callType === 'video' ? '视频' : '语音') + '通话');

        // 设置通话超时（30秒）
        startCallTimeout();

      } catch (err) {
        addLog('发起通话失败: ' + err.message);
        cleanupCall();
        alert('无法获取摄像头/麦克风权限或发起通话失败: ' + err.message);
      }
    }

    // ================================================================

      clearCallTimeout();
      callStatus.textContent = '等待对方接听...';
      STATE.callTimeoutId = setTimeout(() => {
        addLog('通话超时，对方无响应');
        if (STATE.inCall) {
          // 发送超时消息
          sendWSMessage({
            type: 'call-timeout',
            to: STATE.callPeer
          });
          alert('对方无响应');
          hangupCall();
        }
      }, 30000);
    }

    function clearCallTimeout() {
      if (STATE.callTimeoutId) {
        clearTimeout(STATE.callTimeoutId);
        STATE.callTimeoutId = null;
      }
    }

    acceptCallBtn.addEventListener('click', async () => {
      if (!STATE.pendingOffer) return;
      incomingCallToast.style.display = 'none';
      SoundManager.stopRingtone();

      const { from, sdp, callType } = STATE.pendingOffer;
      STATE.pendingOffer = null;
      STATE.isCaller = false;
      STATE.callType = callType;
      STATE.callPeer = from;

      try {
        const constraints = {
          audio: true,
          video: callType === 'video'
        };
        STATE.localStream = await navigator.mediaDevices.getUserMedia(constraints);

        createPeerConnection();

        STATE.localStream.getTracks().forEach(track => {
          STATE.pc.addTrack(track, STATE.localStream);
        });

        // 设置远程描述（对方的Offer）
        await STATE.pc.setRemoteDescription(new RTCSessionDescription(sdp));

        // 创建Answer
        const answer = await STATE.pc.createAnswer();
        await STATE.pc.setLocalDescription(answer);

        sendWSMessage({
          type: 'call-answer',
          to: from,
          sdp: STATE.pc.localDescription
        });

        showCallUI(callType);
        addLog('已接受通话');

      } catch (err) {
        addLog('接受通话失败: ' + err.message);
        cleanupCall();
      }
    });

    rejectCallBtn.addEventListener('click', () => {
      if (STATE.pendingOffer) {
        sendWSMessage({
          type: 'call-end',
          to: STATE.pendingOffer.from
        });
      }
      STATE.pendingOffer = null;
      incomingCallToast.style.display = 'none';
      SoundManager.stopRingtone();
    });

    // ================================================================
    //  PeerConnection 管理（WebRTC 修复）
    // ================================================================
    function createPeerConnection() {
      // 配置：使用 all 模式（先 STUN 再 TURN），添加多个 Google STUN 服务器
      const config = {
        iceTransportPolicy: 'all',
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' },
          {
            urls: 'turn:relay1.expressturn.com:3478',
            username: 'efGHOTR7GRSJYM6W3W',
            credential: '9s6f7HFR8Br3IhEH'
          }
        ]
      };

      STATE.pc = new RTCPeerConnection(config);

      // 处理ICE候选
      STATE.pc.onicecandidate = (event) => {
        if (event.candidate && STATE.callPeer) {
          sendWSMessage({
            type: 'ice-candidate',
            to: STATE.callPeer,
            candidate: event.candidate
          });
        }
      };

      // 处理远程流
      STATE.pc.ontrack = (event) => {
        if (!STATE.remoteStream) {
          STATE.remoteStream = new MediaStream();
        }
        event.streams[0].getTracks().forEach(track => {
          STATE.remoteStream.addTrack(track);
        });
        // 确保远程视频正确渲染
        remoteVideo.srcObject = STATE.remoteStream;
        remoteVideo.onloadedmetadata = () => {
          remoteVideo.play().catch(e => addLog('远程视频播放失败: ' + e.message));
        };
      };

      // ICE连接状态变化处理
      STATE.pc.oniceconnectionstatechange = () => {
        addLog('ICE连接状态: ' + STATE.pc.iceConnectionState);
        if (STATE.pc.iceConnectionState === 'failed' ||
            STATE.pc.iceConnectionState === 'disconnected') {
          addLog('ICE连接失败，自动挂断');
          if (STATE.inCall) {
            alert('连接失败，通话已结束');
            hangupCall();
          }
        }
      };

      // 连接状态变化
      STATE.pc.onconnectionstatechange = () => {
        addLog('连接状态: ' + STATE.pc.connectionState);
        if (STATE.pc.connectionState === 'disconnected' ||
            STATE.pc.connectionState === 'failed' ||
            STATE.pc.connectionState === 'closed') {
          if (STATE.inCall) {
            hangupCall();
          }
        }
      };

      STATE.inCall = true;
      STATE.callStartTime = Date.now();
    }

    async function handleRemoteAnswer(sdp) {
      try {
        await STATE.pc.setRemoteDescription(new RTCSessionDescription(sdp));

        // 设置码率限制（10Mbps宽带限制，720p/1.5Mbps）
        const senders = STATE.pc.getSenders();
        for (const sender of senders) {
          if (sender.track && sender.track.kind === 'video') {
            try {
              const params = sender.getParameters();
              if (!params.encodings) {
                params.encodings = [{}];
              }
              params.encodings.forEach(enc => {
                enc.maxBitrate = 1500000; // 1.5Mbps
              });
              await sender.setParameters(params);
              addLog('视频码率已限制为 1.5Mbps');
            } catch (e) {
              addLog('设置码率失败: ' + e.message);
            }
          }
        }

        // 通话已接通，更新状态
        callStatus.textContent = '通话中';
        startCallTimer();
      } catch (err) {
        addLog('处理Answer失败: ' + err.message);
      }
    }

    // ================================================================
    //  通话计时器
    // ================================================================
    function startCallTimer() {
      if (STATE.callTimerInterval) {
        clearInterval(STATE.callTimerInterval);
      }
      STATE.callTimerInterval = setInterval(() => {
        if (STATE.callStartTime) {
          const elapsed = Math.floor((Date.now() - STATE.callStartTime) / 1000);
          const min = String(Math.floor(elapsed / 60)).padStart(2, '0');
          const sec = String(elapsed % 60).padStart(2, '0');
          callStatus.textContent = '通话中 ' + min + ':' + sec;
        }
      }, 1000);
    }

    function stopCallTimer() {
      if (STATE.callTimerInterval) {
        clearInterval(STATE.callTimerInterval);
        STATE.callTimerInterval = null;
      }
    }

    // ================================================================
    //  通话界面
    // ================================================================
    function showCallUI(callType) {
      callOverlay.style.display = 'flex';
      callOverlay.classList.add('active');
      incomingCallToast.style.display = 'none';

      callPeerName.textContent = STATE.callPeer;
      callStatus.textContent = STATE.isCaller ? '等待对方接听...' : '通话中';

      // 显示本地视频
      if (STATE.localStream) {
        localVideo.srcObject = STATE.localStream;
        localVideo.onloadedmetadata = () => {
          localVideo.play().catch(e => addLog('本地视频播放失败: ' + e.message));
        };
      }

      // 如果是语音通话，隐藏视频元素，显示音频占位
      if (callType === 'audio') {
        remoteVideo.style.display = 'none';
        localVideo.style.display = 'none';
        // 添加音频占位
        const bg = document.createElement('div');
        bg.className = 'audio-call-bg';
        bg.id = 'audioCallBg';
        bg.innerHTML = '<div class="avatar">' + getAvatarChar(STATE.callPeer) + '</div>';
        callOverlay.insertBefore(bg, callOverlay.firstChild);
      } else {
        remoteVideo.style.display = 'block';
        localVideo.style.display = 'block';
        const existing = document.getElementById('audioCallBg');
        if (existing) existing.remove();
      }

      // 重置麦克风/摄像头按钮状态
      micToggleBtn.classList.remove('muted');
      cameraToggleBtn.classList.remove('off');
    }

    // 麦克风切换
    micToggleBtn.addEventListener('click', () => {
      if (STATE.localStream) {
        const audioTrack = STATE.localStream.getAudioTracks()[0];
        if (audioTrack) {
          audioTrack.enabled = !audioTrack.enabled;
          micToggleBtn.classList.toggle('muted');
        }
      }
    });

    // 摄像头切换
    cameraToggleBtn.addEventListener('click', () => {
      if (STATE.localStream) {
        const videoTrack = STATE.localStream.getVideoTracks()[0];
        if (videoTrack) {
          videoTrack.enabled = !videoTrack.enabled;
          cameraToggleBtn.classList.toggle('off');
        }
      }
    });

    // 挂断
    hangupBtn.addEventListener('click', () => {
      if (STATE.callPeer) {
        sendWSMessage({
          type: 'call-end',
          to: STATE.callPeer
        });
      }
      hangupCall();
    });

    function hangupCall() {
      SoundManager.stopRingtone();
      clearCallTimeout();
      stopCallTimer();

      // 记录通话时长
      let callDuration = 0;
      if (STATE.callStartTime) {
        callDuration = Math.floor((Date.now() - STATE.callStartTime) / 1000);
      }

      // 通知对方（如果还未通知）
      if (STATE.inCall && STATE.callPeer) {
        sendWSMessage({
          type: 'call-end',
          to: STATE.callPeer
        });
      }

      // 清理资源
      cleanupCall();
      callOverlay.style.display = 'none';
      callOverlay.classList.remove('active');

      // 移除音频占位背景
      const audioBg = document.getElementById('audioCallBg');
      if (audioBg) audioBg.remove();

      // 恢复视频显示
      remoteVideo.style.display = 'block';
      localVideo.style.display = 'block';

      addLog('通话已结束');
    }

    function cleanupCall() {
      STATE.inCall = false;
      STATE.isCaller = false;
      STATE.callPeer = null;
      STATE.pendingOffer = null;
      STATE.callStartTime = null;

      // 关闭PeerConnection
      if (STATE.pc) {
        try { STATE.pc.close(); } catch {}
        STATE.pc = null;
      }

      // 释放本地流 - 停止所有轨道
      if (STATE.localStream) {
        STATE.localStream.getTracks().forEach(track => {
          try { track.stop(); } catch {}
        });
        STATE.localStream = null;
      }

      // 清除远程流
      if (STATE.remoteStream) {
        STATE.remoteStream.getTracks().forEach(track => {
          try { track.stop(); } catch {}
        });
        STATE.remoteStream = null;
      }

      // 清空视频元素
      remoteVideo.srcObject = null;
      localVideo.srcObject = null;
    }

    // ================================================================
    //  初始化
    // ================================================================
    addLog('即时通讯系统已加载，服务器地址: ' + SERVER_HOST);
  </script>
</body>
</html>
