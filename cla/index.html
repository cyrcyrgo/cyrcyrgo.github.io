<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YJS Cloud LLM Agent</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>

<div id="login">
  <div class="card">
    <h1>YJS <span style="color:#22d3ee">Cloud LLM Agent</span></h1>
    <p class="sub">邮箱验证码登录 · 本机 Agent 智能体</p>
    <div class="field">
      <input id="login-email" type="email" placeholder="邮箱地址" autocomplete="email" />
    </div>
    <div class="field row">
      <input id="login-code" placeholder="6 位验证码" inputmode="numeric" maxlength="6" />
      <button id="btn-send" class="ghost" style="flex:0 0 130px">获取验证码</button>
    </div>
    <button id="btn-verify" style="width:100%;padding:12px">登录 / 注册</button>
    <div id="login-msg" class="msg"></div>
    <div class="settings">
      <div>后端地址：<span id="api-label">检测中…</span></div>
      <input id="api-input" placeholder="手动填写后端地址" />
    </div>
  </div>
</div>

<div id="app" class="hidden">
  <button id="sidebar-toggle" class="sidebar-toggle" title="收展对话栏">☰</button>
  <aside class="sidebar" id="sidebar">
    <div class="brand">YJS <span>Agent</span></div>
    <div class="userbox">
      <div class="email" id="user-email"></div>
      <div style="margin-top:6px" id="quota-text">空间 --</div>
      <div class="quota" id="quota-bar"><i style="width:0%"></i></div>
    </div>
    <button id="btn-new" style="width:100%">+ 新建对话</button>
    <div class="conv-list" id="conv-list"></div>
    <div class="sidebar-foot">
      <button id="btn-files" class="ghost" style="flex:1">我的文件</button>
      <button id="btn-logout" class="ghost">退出</button>
    </div>
  </aside>

  <main class="chat">
    <div class="chat-head">
      <h2 id="chat-title">个人空间</h2>
      <span id="model-tag" class="tag ok" style="display:none"></span>
      <span id="mode-tag" class="tag mode" style="display:none"></span>
    </div>
    <div class="messages" id="messages">
      <div class="empty">
        在左侧新建一个对话，然后描述你的任务。<br />
        右下切换模型和工作模式：快速 / 思考 / 工作 / 专家。
      </div>
    </div>
    <div class="composer">
      <textarea id="chat-input" placeholder="描述任务…（Enter 发送，Shift+Enter 换行）"></textarea>
      <div class="comp-row">
        <div class="composer-controls">
          <select id="model-select" class="model-select" title="选择模型">
            <option value="">加载中…</option>
          </select>
          <select id="mode-select" class="mode-select" title="工作模式">
            <option value="work">工作模式 · Agent 执行</option>
            <option value="expert">专家模式 · 思考 + 多步工具</option>
            <option value="think">思考模式 · 深度分析</option>
            <option value="fast">快速模式 · 直接输出</option>
          </select>
        </div>
        <button id="btn-send-msg" class="send">发送</button>
      </div>
    </div>
  </main>
</div>

<div id="files-panel" class="drawer hidden">
  <div class="drawer-head">
    <h3>我的文件</h3>
    <div><button id="btn-close-files" class="ghost">关闭</button></div>
  </div>
  <div id="files-usage" style="color:#8b98b4;font-size:12px;margin-bottom:10px"></div>
  <div id="files-list"></div>
  <div class="foot"><button id="btn-clear-files" class="ghost">清空全部</button></div>
</div>

<div id="preview-panel" class="drawer hidden">
  <div class="drawer-head">
    <h3 id="preview-title">预览</h3>
    <div><button id="btn-preview-close" class="ghost">关闭</button></div>
  </div>
  <div id="preview-body"></div>
</div>

<script src="assets/app.js"></script>
</body>
</html>
