      cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true); cv.setUint16(10, method, true);
      cv.setUint16(12, now.time, true); cv.setUint16(14, now.date, true);
      cv.setUint32(16, crc, true); cv.setUint32(20, payload.length, true); cv.setUint32(24, data.length, true);
      cv.setUint16(28, nb.length, true); cv.setUint16(30, 0, true); cv.setUint16(32, 0, true);
      cv.setUint16(34, 0, true); cv.setUint16(36, 0, true); cv.setUint32(38, 0, true);
      cv.setUint32(42, offset, true);
      centrals.push(ch, nb);
      offset += 30 + nb.length + payload.length;
      cdSize += 46 + nb.length;
    }
    var end = new Uint8Array(22), ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054b50, true); ev.setUint16(4, 0, true); ev.setUint16(6, 0, true);
    ev.setUint16(8, items.length, true); ev.setUint16(10, items.length, true);
    ev.setUint32(12, cdSize, true); ev.setUint32(16, offset, true); ev.setUint16(20, 0, true);
    return new Blob(chunks.concat(centrals, [end]), { type: 'application/zip' });
  }

  
var logEl = document.getElementById('log');
var lines = [];
function out(s){ lines.push(s); logEl.textContent = lines.join('\n'); }
async function run(){
  var ok = 0, bad = 0;
  for (var i = 0; i < PATHS.length; i++){
    var p = PATHS[i], url = CFG.official[0] + p.split('/').map(encodeURIComponent).join('/');
    var t0 = Date.now();
    try{
      var res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var blob = await res.blob();
      var r = await decryptWithCandidates(blob, null);
      var buf = new Uint8Array(await r.blob.arrayBuffer());
      var head = Array.prototype.map.call(buf.subarray(0, 4), function(x){ return ('0' + x.toString(16)).slice(-2); }).join('');
      ok++; out('OK   ' + p + ' -> ' + r.name + ' ' + buf.length + 'B head=' + head + ' ' + (Date.now() - t0) + 'ms');
    }catch(e){ bad++; out('ERR  ' + p + ' :: ' + (e.code || '') + ' ' + (e.message || e)); }
  }
  try{
    var rand = new Uint8Array(1 << 20);
    for (var k = 0; k < rand.length; k++) rand[k] = (k * 31 + 7) & 255;
    var t1 = Date.now();
    var z = await makeEncryptedZip(rand, '往返测试.bin', CFG.zipPassword);
    var back = await decryptWithCandidates(z, null);
    var rb = new Uint8Array(await back.blob.arrayBuffer());
    var same = rb.length === rand.length;
    for (var m = 0; same && m < rb.length; m++) if (rb[m] !== rand[m]) same = false;
    out('ROUNDTRIP 1MB ' + (same ? 'OK' : 'MISMATCH') + ' zip=' + z.size + ' ' + (Date.now() - t1) + 'ms');
    var pz = await makePlainZip([{ name: 'a.txt', data: rand.subarray(0, 1000) }, { name: 'b.bin', data: rand.subarray(0, 50000) }]);
    out('PLAINZIP ' + pz.size + 'B');
  }catch(e){ out('ROUNDTRIP ERR :: ' + (e.code || '') + ' ' + (e.message || e)); }
  var summary = 'DONE ok=' + ok + ' fail=' + bad;
  out(summary);
  document.title = summary;
}
run();
