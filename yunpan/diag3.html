function fmtSize(n){
    n = Number(n) || 0;
    if (n < 1024) return n + ' B';
    var u = ['KB','MB','GB','TB'], i = -1;
    do { n /= 1024; i++; } while (n >= 1024 && i < 3);
    return (n >= 100 ? n.toFixed(0) : n.toFixed(1)) + ' ' + u[i];
  }

function fmtSpeed(bps){
    if (!bps || bps < 1) return '0 B/s';
    return fmtSize(bps) + '/s';
  }

async function readBodyWithProgress(res, onProgress){
    var total = Number(res.headers.get('content-length')) || 0;
    if (!onProgress || !res.body || !res.body.getReader){
      var b = await res.blob();
      if (onProgress) onProgress(b.size, total || b.size, 0);
      return b;
    }
    var reader = res.body.getReader();
    var chunks = [], loaded = 0;
    var t0 = Date.now(), lastT = t0, lastB = 0, speed = 0;
    for (;;){
      var r = await reader.read();
      if (r.done) break;
      chunks.push(r.value);
      loaded += r.value.length;
      var now = Date.now();
      if (now - lastT >= 220){
        speed = (loaded - lastB) * 1000 / (now - lastT);
        lastT = now; lastB = loaded;
        onProgress(loaded, total, speed);
      }
    }
    if (!loaded) throw new Error('空响应');
    onProgress(loaded, total || loaded, 0);
    return new Blob(chunks);
  }

function srcLabel(base){ return base.replace(/^https?:\/\//, '').replace(/\/$/, ''); }

function isOfficialSource(base){
    return /^(https?:)?\/\/(raw\.githubusercontent\.com|github\.com)\//i.test(base);
  }

function sourceList(useOfficial){
    var bases = (useOfficial ? CFG.official : CFG.mirrors).slice();
    if (avoidBase){
      var ai = bases.indexOf(avoidBase);
      if (ai >= 0){ bases.splice(ai, 1); bases.push(avoidBase); }
    }
    if (preferredBase && preferredBase !== avoidBase){
      var pi = bases.indexOf(preferredBase);
      if (pi > 0){ bases.splice(pi, 1); bases.unshift(preferredBase); }
    }
    return bases;
  }

async function verifyBlob(path, blob){
    var name = String(path), ct = (blob.type || '').toLowerCase();
    if (!/\.(zip|html?)$/i.test(name) && ct.indexOf('text/html') >= 0 && blob.size < 8192){
      throw new Error('返回了错误页面');
    }
    if (/\.zip$/i.test(name)){
      var head = new Uint8Array(await blob.slice(0, 2).arrayBuffer());
      if (head[0] !== 0x50 || head[1] !== 0x4b) throw new Error('非 ZIP 数据');
      /* 末尾必须有中央目录结束标记（EOCD），否则是传输被截断 */
      var tailLen = Math.min(blob.size, 65557);
      var tail = new Uint8Array(await blob.slice(blob.size - tailLen).arrayBuffer());
      var eocd = false;
      for (var i = tail.length - 22; i >= 0; i--){
        if (tail[i] === 0x50 && tail[i+1] === 0x4b && tail[i+2] === 0x05 && tail[i+3] === 0x06){ eocd = true; break; }
      }
      if (!eocd) throw new Error('ZIP 数据被截断');
    }
  }

async function fetchFromBase(base, path, rel, ctrl, onProgress){
    var t0 = Date.now();
    var phase = 'ttfb';
    var budget = isOfficialSource(base) ? CFG.officialTimeout : CFG.mirrorSlow;
    var ttfb = setTimeout(function(){ try{ ctrl.abort(); }catch(_){} }, budget);
    var stall = null, totalTimer = null;
    try{
      var res = await fetch(base + rel, { cache: 'no-store', signal: ctrl.signal });
      clearTimeout(ttfb);
      phase = 'head';
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var total = Number(res.headers.get('content-length')) || 0;
      /* Content-Encoding 在 CORS 下读不到，无法判断是否压缩：只拦「收到的比声明少」的截断，
         收到比声明多是压缩后自动解压的正常情况，交给后面的 ZIP 结构校验 */
      var expectLen = total;
      var beat = function(){
        if (stall) clearTimeout(stall);
        stall = setTimeout(function(){ phase = 'stall'; try{ ctrl.abort(); }catch(_){} }, CFG.stallTimeout);
      };
      phase = 'body';
      beat();
      totalTimer = setTimeout(function(){ phase = 'total'; try{ ctrl.abort(); }catch(_){} }, CFG.downloadTimeout);
      var blob;
      try{
        blob = await readBodyWithProgress(res, function(l, t, s){
          beat();
          if (onProgress) onProgress(l, t || total, s);
        });
      }finally{
        if (stall) clearTimeout(stall);
        clearTimeout(totalTimer);
      }
      if (!blob.size) throw new Error('空响应');
      if (expectLen && blob.size < expectLen) throw new Error('数据不完整 ' + blob.size + '/' + expectLen);
      await verifyBlob(path, blob);
      return { base: base, blob: blob, ms: Date.now() - t0, size: blob.size };
    }catch(e){
      if (e && e.name === 'AbortError'){
        if (phase === 'stall') throw new Error('传输卡顿');
        if (phase === 'total') throw new Error('下载超时');
        throw new Error('响应超时');
      }
      throw e;
    }finally{
      clearTimeout(ttfb);
    }
  }

function fetchHedged(bases, path, rel, errors, onProgress){
    return new Promise(function(resolve, reject){
      var idx = 0, active = 0, finished = false, seq = 0, owner = 0;
      var hedgeTimer = 0, aborts = [];
      function finish(err, val){
        if (finished) return;
        finished = true;
        clearTimeout(hedgeTimer);
        aborts.forEach(function(c){ try{ c.abort(); }catch(_){} });
        if (err) reject(err); else resolve(val);
      }
      function schedule(delay){
        if (finished || idx >= bases.length || active >= 2) return false;
        clearTimeout(hedgeTimer);
        hedgeTimer = setTimeout(startOne, delay == null ? CFG.hedgeDelay : delay);
        return true;
      }
      function startOne(){
        if (finished || idx >= bases.length || active >= 2) return;
        var base = bases[idx++];
        var ctrl = new AbortController();
        aborts.push(ctrl);
        var my = ++seq;
        if (!owner) owner = my;
        active++;
        fetchFromBase(base, path, rel, ctrl, function(l, t, s){
          if (owner === my && onProgress) onProgress(l, t, s);
        }).then(function(r){
          active--;
          if (finished) return;
          preferredBase = base;
          if (avoidBase === base) avoidBase = '';
          console.log('[yunpan] source ok:', srcLabel(base), r.ms + 'ms / ' + fmtSize(r.size));
          finish(null, r);
        }).catch(function(e){
          active--;
          if (finished) return;
          var why = (e && e.message) || '失败';
          errors.push(srcLabel(base) + ' ' + why);
          console.warn('[yunpan] source fail:', srcLabel(base), why);
          if (owner === my) owner = 0;
          var more = schedule(0);
          if (!more && active === 0) finish(new Error('镜像均不可用'));
        });
        schedule();
      }
      startOne();
    });
  }

async function fetchRepoBlob(path, bust, onProgress){
    var rel = encodePath(path) + (bust ? '?t=' + Date.now() : '');

      }catch(e3){
        errors.push('官方 API ' + ((e3 && e3.message) || '失败'));
      }
    }
    throw new Error('所有文件源均不可用（' + errors.join('；') + '）');
  }

function ensureZipLib(){
    if (window.zip && window.zip.ZipWriter) return Promise.resolve(window.zip);
    if (zipLoading) return zipLoading;
    zipLoading = (async function(){
      for (var i = 0; i < ZIP_CDN.length; i++){
        try{
          await new Promise(function(resolve, reject){
            var s = document.createElement('script');
            s.src = ZIP_CDN[i];
            s.async = true;
            s.onload = resolve;
            s.onerror = function(){ reject(new Error('cdn fail')); };
            document.head.appendChild(s);
          });
          if (window.zip && window.zip.ZipWriter){
            if (window.zip.configure) window.zip.configure({ useWebWorkers: false });
            return window.zip;
          }
        }catch(_){ /* 切换下一个 CDN */ }
      }
      zipLoading = null;
      var e = new Error('解密组件加载失败，请检查网络后重试');
      e.code = 'ziplib';
      throw e;
    })();
    return zipLoading;
  }

async function decryptZipBlob(zipBlob, password, onProgress){
    var z = await ensureZipLib();
    var reader = new z.ZipReader(new z.BlobReader(zipBlob), { password: password, useWebWorkers: false });
    try{
      var entries = await reader.getEntries();
      var entry = null;
      for (var i = 0; i < entries.length; i++){
        if (!entries[i].directory){ entry = entries[i]; break; }
      }
      if (!entry) throw new Error('压缩包内没有文件');
      if (onProgress) onProgress(0);
      var out = await entry.getData(new z.BlobWriter(), {
        useWebWorkers: false,
        onprogress: function(p, total){
          if (!onProgress) return;
          var pct = total ? Math.min(99, Math.round(p / total * 100)) : 0;
          onProgress(pct);
        }
      });
      if (onProgress) onProgress(100);
      return { blob: out, name: entry.filename || 'decrypted' };
    }finally{
      try{ await reader.close(); }catch(_){}
    }
  }

async function pullDecrypted(entry, zip, set, verb){
    var label = verb || '下载中';
    var pull = function(txt){
      return fetchEntryBlob(entry, function(l, t, s){
        set(txt + '… ' + (t ? Math.floor(l / t * 100) + '% · ' : '') + fmtSize(l) + ' · ' + fmtSpeed(s));
      });
    };
    var blob = await pull(label);
    if (!zip) return { blob: blob };
    for (var attempt = 0; ; attempt++){
      try{
        set('解密中… 0%');
        var out = await decryptZipBlob(blob, CFG.zipPassword, function(p){
          set('解密中… ' + p + '% · ' + fmtSize(blob.size));
        });
        return { blob: out.blob, name: out.name };
      }catch(err){
        /* 解密组件没加载出来不是数据问题，重拉也没用，直接提示真实原因 */
        if (err && err.code === 'ziplib') throw err;
        if (attempt >= 1){
          var why = (err && err.message) || '数据校验失败';
          if (/password/i.test(why)) why = '该文件的加密密码与当前设置不一致';
          else if (/invalid|compressed|signature/i.test(why)) why = '文件数据已损坏（压缩校验失败）';
          throw new Error('解密失败：' + why + '（已自动换源重试）');
        }
        avoidBase = preferredBase;
        preferredBase = '';
        blob = await pull('重新拉取');
      }
    }
  }
